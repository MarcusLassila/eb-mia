# Online residual-shape sweep: 2 attacks x 5 shapes x 9 fixed targets = 90 audits.
# Mixed cases use all eligible DDPM and FM references after excluding the
# target split and its complement. Run with: bash run_sample_hg_shape_ablation.sh
audit_mode: sample
round_robin: false
seed: 0
loss_normalization: log_standardized
show_auc: false
results_dir_name: sample_hg_shape_exploration_benchmark
attacks:
- name: HG_LiRA-a1p1
  attack: HG_LiRA
  offline: false
  loss_transformation: none
  residual_shape: 1.1
  n_gibbs_samples: 64
  n_gibbs_warmup: 64
  n_quadrature: 65
- name: HG_LiRA-a1p5
  attack: HG_LiRA
  offline: false
  loss_transformation: none
