dataset: CelebA
audit_mode: entity
round_robin: false
mode: max_one_train
min_samples_per_entity: 5
max_samples_per_entity: 15
audit_random_seed: 0
loss_normalization: log_standardized
loss_path_pairs:
- target_loss_paths:
  - loss-signals/DDPM-CelebA-ent-f0p5-p0p5-sz64-epoch500
  shadow_loss_paths: &mixed_reference_paths
  - loss-signals/DDPM-CelebA-ent-f0p5-p0p5-sz64-epoch500
  - loss-signals/FM-CelebA-ent-f0p5-p0p5-sz64-epoch700
- target_loss_paths:
  - loss-signals/FM-CelebA-ent-f0p5-p0p5-sz64-epoch700
  shadow_loss_paths: *mixed_reference_paths
attacks:
- name: CompositeLiRA
  attack: CompositeLiRA
  offline: true
  covariance: spherical
  use_global_dispersion: false
- name: CompositeBASE
  attack: CompositeBASE
  offline: true
  prior: 0.5
- name: HBE-GlobalLatent
  attack: HBE_GlobalLatent
  offline: true
  n_folds: 5
  quadrature_nodes: 50
  max_hyper_units: 4096
  factor_steps: 50
  factor_tolerance: 1.0e-7
results_dir_name: audit_results_entity_mismatched_offline
