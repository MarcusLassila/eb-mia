CIFAR10-VAE:
  dataset: "CIFAR10"
  model: "VAE"
  batch_size: 512
  n_audits: 10
  n_audit_samples: 20000
  attacks:
    GlobalLossAttack:
      attack: "GlobalLossAttack"
      n_loss_samples: 20
    UncalibratedBASE:
      attack: "UncalibratedBASE"
      prior: 0.5
      n_loss_samples: 20
    XGBAttack:
      attack: "ClassifierAttack"
      n_loss_samples: 20
      classifier: "XGBoost"
    MLPAttack:
      attack: "ClassifierAttack"
      n_loss_samples: 20
      classifier: "MLP"
