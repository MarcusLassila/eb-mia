batch_size: 128
simul_batch_size: 128
dataset: "CelebA2"
epochs: 1000
epochs_per_checkpoint: 100
lr: 0.0002
weight_decay: 0.01
ema_decay: 0.0
grad_clip: 0.0
autocast_dtype: "bfloat16"
lr_scheduler: "cosine"
image_resolution: 32
dataloader_config:
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
val_frac: 0.02
model: "VAE"
latent_dim: 128
